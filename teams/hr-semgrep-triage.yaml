# Static sweep line: semgrep/opengrep over decompiled code, LLM triage of findings.
name: hr-semgrep-triage
description: >-
  Static analysis over the decompiled tree: opengrep with C rules, then
  per-finding triage (real bug / false positive / needs more context) with
  a bounded budget, verified and reported.
version: 1
tags: [halo-re, static]
agents:
- agent: hr-orchestrator
  role: main
  as: boss
- agent: hr-analyst
  role: subagent
  as: analyst
- agent: hr-vuln-reviewer
  role: judge
  as: verify
- agent: hr-reporter
  role: custom
  as: report
delegation:
  mode: by-skill
  max_parallel: 2
  max_depth: 1
  handoff: structured
routing:
  scan: analyst
  triage: verify
  report: report
  default: boss
