# Halo RE — reverse-engineering capability pack manifest for Halo Harness.
#
# Contract: the shipped pack program (Halo 3.2.0.0+; validated against
# halo 3.2.1.0). Ghidra itself is NEVER bundled (~1 GB): the pack ships an
# MCP server that drives a local Ghidra install through pyghidra, a doctor
# skill that finds and verifies the install, and a config key for its path.
id: halo-re
name: Halo RE
version: 0.3.0
description: >-
  Binary reverse-engineering capability pack: a read-only Ghidra MCP server
  (decompile, disassemble, search, xrefs, callgraph), procedural RE skills
  distilled from agentic-RE training, kernel-driver and patch-diff audit
  playbooks, and triage/analysis/report agent roles. Adds binary analysis
  to Halo; owns no runtime, routing, or orchestration of its own.
author: Pinball Genie LLC (github.com/roloVibes)
license: All rights reserved — Pinball Genie LLC (see /LICENSE)
halo_api:
  # Extension API version (halo_harness.ext.API_VERSION), not the Halo version.
  min: "1.0"
halo:
  # First Halo version with the pack registry + workflows (3.2.0.0).
  min: 3.2.0.0
capabilities:
  - ghidra        # the pack's own read-only Ghidra MCP server (mcp/ghidra_server.py)
  - triage        # binary platform/arch classification and inventory
  - audit         # kernel-driver IOCTL, kernel-API and import-surface auditing
  - diff          # patch/CVE comparative analysis (ghidriff similarity triage)
  - static        # semgrep/opengrep scanning over decompiled code
  - findings      # evidence-chained RE findings store + lifecycle (tools/findings_store.py)
  - reporting     # confirmed-only report + leadership email renderers (reporting/)
  - skills        # procedural RE know-how contributed as skills
requires: []      # no hard pack dependencies
contributes:
  agents:
    - agents/hr-orchestrator.yaml
    - agents/hr-triage.yaml
    - agents/hr-analyst.yaml
    - agents/hr-vuln-reviewer.yaml
    - agents/hr-reporter.yaml
  teams:
    - teams/hr-binary-triage.yaml
    - teams/hr-kernel-driver-audit.yaml
    - teams/hr-patch-diff.yaml
    - teams/hr-semgrep-triage.yaml
  skills: skills            # the plugin layout's own place
  mcp:
    - {name: ghidra, description: read-only Ghidra analysis (decompile, disassemble, search, xrefs, imports, callgraph)}
  workflows: [triage, semgrep-triage]
  artifacts: [re-finding-report]
  events:
    - {kind: re.finding, schema: events/re.finding.json, description: one finding lifecycle moment (identified/reviewed/confirmed/terminal) from authorized binary analysis}
    - {kind: re.session, schema: events/re.session.json, description: a Ghidra analysis session opened or closed}
  studio:
    sections:
      - id: halo-re
        title: Halo RE
        blurb: Findings for the active analysis engagement — identified, reviewed, confirmed.
        help: >-
          The browser panel is the pack's own script (grant studio-script to
          run it): every finding clickable — full detail, evidence, validation,
          reviewer decision — with filters, search and live refresh. The counts
          and table panels read the pack's data folder, written by
          tools/findings_view.py on every store change (and by
          `findings_view.py auto`). The feed shows re.finding events.
        panels:
          - id: browser
            title: Findings browser
            kind: bundle
            source: studio/findings.js
            w: 24
            h: 120
            help: >-
              Interactive findings browser: click a row (or Enter on a selected
              row) for the full finding — description, binary/function, CWE,
              evidence ledger rows, validation, reviewer decision, remediation,
              audit history. Filter by severity/state/source, free-text search,
              copy as markdown, open raw JSON. Refreshes on re.finding events
              and every 15s. Requires the studio-script grant.
          - id: counts
            title: Counts
            kind: table
            source: "data:findings/counts.json"
            columns: [engagement, identified, reviewed, confirmed]
            w: 24
            h: 12
          - id: table
            title: Findings
            kind: table
            source: "data:findings/summary.json"
            columns: [finding_id, title, severity, state, target_ref, source, updated]
            w: 24
            h: 60
          - id: feed
            title: Lifecycle
            kind: events
            w: 24
            h: 40
            help: "re.finding events as they happen (analyst, scanner, import, Ghidra session)"
    palette:
      - {id: open-browser, label: Open the RE findings browser, action: "route:halo-re/browser"}
      - {id: open-table, label: Open the RE findings table, action: "route:halo-re/table"}
      - {id: open-lifecycle, label: Open the RE findings lifecycle feed, action: "route:halo-re/feed"}
    config_form: true
permissions:
  - mcp:ghidra
  - bash        # the skills drive CLI RE tools (file/nm/strings/otool, ghidrecomp, opengrep, craft-anything-cli)
  - studio-script # the findings browser bundle panel (studio/findings.js)
config:
  schema:
    properties:
      ghidra_install_dir:
        {type: string, description: "Path to a Ghidra install (the folder holding Ghidra/application.properties). Auto-detected when empty; the doctor skill verifies by effect and can download the official release on demand."}
      project_dir:
        {type: string, description: "Where Ghidra projects live. MUST NOT contain a path element starting with a dot (Ghidra refuses it). Default ~/ghidra-projects."}
      tools_dir:
        {type: string, description: "Where the on-demand installer puts downloads (default ~/halo-re-tools). The Ghidra/REA release zips land under <tools_dir>/downloads/."}
      rea_dir:
        {type: string, description: "Where the optional REA (Reverse Engineer Anything) release was extracted, if you installed it."}
      craft_anything_cli_path:
        {type: string, description: "Path to the craft-anything-cli binary (external tool, not bundled). Empty = auto-detect on PATH; when absent the craft-anything skill skips visibly."}
    additionalProperties: false
  defaults:
    ghidra_install_dir: ""
    project_dir: ""
    tools_dir: ""
    rea_dir: ""
    craft_anything_cli_path: ""
migrations: []
