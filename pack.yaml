# Halo RE (halo-re): binary reverse engineering as a Halo pack.
# HALO-PACK.md says how to work on it; README.md lists every part. Every value
# here is checked at install: `halo pack test .` runs every check.
id: halo-re
name: Halo RE
version: 0.5.0
description: >-
  Binary reverse-engineering capability pack: a read-only Ghidra MCP server
  (decompile, disassemble, search, xrefs, callgraph), procedural RE skills
  distilled from agentic-RE training, kernel-driver and patch-diff audit
  playbooks, and triage/analysis/report agent roles. Adds binary analysis
  to Halo; owns no runtime, routing, or orchestration of its own.
author: Pinball Genie LLC (github.com/roloVibes)
license: All rights reserved — Pinball Genie LLC (see /LICENSE)
halo_api:
  # The extension API version (halo_harness.ext.API_VERSION), not the Halo
  # version. 1.1 is the floor for a pack that declares `requires` tools.
  min: "1.1"
  max: "1.9"
halo:
  # First Halo version this pack is written for (pack test/doctor, API 1.1).
  min: "3.3"
# The capabilities this pack declares. A workflow's `prerequisites.capabilities`
# and a stage's `needs:` must name one of these, and so must every name under
# contributes.fleet.capabilities below.
capabilities:
  - ghidra        # the pack's own read-only Ghidra MCP server (mcp/ghidra_server.py)
  - triage        # binary platform/arch classification and inventory
  - audit         # kernel-driver IOCTL, kernel-API and import-surface auditing
  - diff          # patch/CVE comparative analysis (ghidriff similarity triage)
  - static        # semgrep/opengrep scanning over decompiled code
  - findings      # evidence-chained RE findings store + lifecycle (tools/findings_store.py)
  - reporting     # confirmed-only report + leadership email renderers (reporting/)
  - skills        # procedural RE know-how contributed as skills
  - halo-re.analysis  # the fleet advertisement (contributes.fleet below)
# External tools the pack drives. Halo NEVER installs one: `halo pack doctor`
# names a missing one with its install line, `halo pack test` skips what it gates.
requires:
  - kind: python
    name: pyghidra
    install:
      windows: python -m pip install pyghidra
      linux: python -m pip install pyghidra
      mac: python -m pip install pyghidra
    url: https://github.com/NationalSecurityAgency/ghidra
    license: Apache-2.0
    why: bridges Halo's Python to a local Ghidra install, so the pack's MCP server can open a project and decompile
    used_by: [mcp:ghidra, skills/ghidra-doctor]
  - kind: command
    name: opengrep
    install:
      windows: irm https://raw.githubusercontent.com/opengrep/opengrep/main/install.ps1 | iex
      linux: curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
      mac: curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
    url: https://github.com/opengrep/opengrep
    license: LGPL-2.1
    why: >-
      scans decompiled output; the OSS `semgrep` CLI strips the JSON fields (extra.lines, extra.metavars) a triage
      model needs, so opengrep is the required scanner, not semgrep
    used_by: [workflows/semgrep-triage.yaml, skills/semgrep-decompiled]
  - kind: python
    name: ghidrecomp
    install:
      windows: uv tool install ghidrecomp
      linux: uv tool install ghidrecomp
      mac: uv tool install ghidrecomp
    url: https://github.com/clearbluejar/ghidrecomp
    license: GPL-3.0
    why: decompiles a whole binary to one .c file per function, which is what the SAST scan and the token-budget pass read
    used_by: [skills/semgrep-decompiled, skills/token-budget-a-binary]
  - kind: command
    name: craft-anything-cli
    install:
      windows: git clone https://github.com/storytold/craft-anything && cargo install --path craft-anything/apps/craft-anything-cli
      linux: git clone https://github.com/storytold/craft-anything && cargo install --path craft-anything/apps/craft-anything-cli
      mac: git clone https://github.com/storytold/craft-anything && cargo install --path craft-anything/apps/craft-anything-cli
    url: https://github.com/storytold/craft-anything
    license: MIT OR Apache-2.0
    why: the external study engine for formats the Ghidra path does not cover (.NET, JVM/APK, Mach-O, WASM, firmware)
    used_by: [skills/craft-anything-study]
contributes:
  agents:
    - agents/hr-orchestrator.yaml
    - agents/hr-triage.yaml
    - agents/hr-analyst.yaml
    - agents/hr-vuln-reviewer.yaml
    - agents/hr-reporter.yaml
  teams:
    - teams/hr-binary-triage.yaml
    - teams/hr-kernel-driver-audit.yaml
    - teams/hr-patch-diff.yaml
    - teams/hr-semgrep-triage.yaml
  skills: skills
  commands: commands
  mcp:
    - {name: ghidra, description: read-only Ghidra analysis (decompile, disassemble, search, xrefs, imports, callgraph)}
  workflows: [triage, semgrep-triage]
  artifacts: [re-finding-report]
  events:
    - {kind: re.finding, schema: events/re.finding.json, description: one finding lifecycle moment (identified/reviewed/confirmed/terminal) from authorized binary analysis}
    - {kind: re.session, schema: events/re.session.json, description: a Ghidra analysis session opened or closed}
    - {kind: re.craft.study, schema: events/re.craft.study.json, description: one moment in a craft-anything study (study → build → check → ready)}
  studio:
    sections:
      - id: re
        title: Reverse engineering
        blurb: Findings for the active analysis engagement — identified, reviewed, confirmed.
        help: >-
          The browser panel is the pack's own script (grant studio-script to
          run it): every finding clickable — full detail, evidence, validation,
          reviewer decision — with filters, search and live refresh. The counts
          and table panels read the pack's data folder, written by
          tools/findings_view.py on every store change (and by
          `findings_view.py auto`). The feed shows re.finding events.
        panels:
          - id: browser
            title: Findings browser
            kind: bundle
            source: studio/findings.js
            w: 24
            h: 120
            help: >-
              Interactive findings browser: click a row (or Enter on a selected
              row) for the full finding — description, binary/function, CWE,
              evidence ledger rows, validation, reviewer decision, remediation,
              audit history. Filter by severity/state/source, free-text search,
              copy as markdown, open raw JSON. Refreshes on re.finding events
              and every 15s. Requires the studio-script grant.
          - id: counts
            title: Counts
            kind: table
            source: "data:findings/counts.json"
            columns: [engagement, identified, reviewed, confirmed]
            w: 24
            h: 12
          - id: table
            title: Findings
            kind: table
            source: "data:findings/summary.json"
            columns: [finding_id, title, severity, state, target_ref, source, updated]
            w: 24
            h: 60
          - id: feed
            title: Lifecycle
            kind: events
            w: 24
            h: 40
            help: "re.finding events as they happen (analyst, scanner, import, Ghidra session)"
      - id: craft
        title: Craft & rebuild
        blurb: Study how any software works, then craft your own version (craft-anything).
        help: >-
          Record a study with tools/craft_studies.py — the craft-anything-study
          skill walks the study → build → check pipeline and keeps the record
          current. The browser shows every study clickable (target, mode, stack,
          output folder, check mismatches); the tables and feed read the pack
          data folder. Mode `deep` reads code/files — clean-room is the default.
        panels:
          - id: studies
            title: Craft studies
            kind: bundle
            source: studio/craft.js
            w: 24
            h: 120
            help: >-
              Interactive studies browser: click a row (or Enter) for the full
              study — target, mode, stack requested, output folder, agent,
              check mismatches, notes — with filters, search, copy as markdown
              and live refresh on re.craft.study events. Requires the
              studio-script grant.
          - id: craft-counts
            title: Studies
            kind: table
            source: "data:craft/counts.json"
            columns: [studies, ready, in_progress]
            w: 24
            h: 12
          - id: craft-table
            title: Craft studies
            kind: table
            source: "data:craft/studies.json"
            columns: [study_id, target, target_kind, mode, stack, agent, status, updated]
            w: 24
            h: 60
          - id: craft-feed
            title: Study lifecycle
            kind: events
            w: 24
            h: 40
            help: "re.craft.study events as they happen (planned, studying, building, checking, ready)"
    palette:
      - {id: open-browser, label: Open the RE findings browser, action: "route:re/browser"}
      - {id: open-table, label: Open the RE findings table, action: "route:re/table"}
      - {id: open-lifecycle, label: Open the RE findings lifecycle feed, action: "route:re/feed"}
      - {id: open-craft, label: Open the craft studies browser, action: "route:craft/studies"}
      - {id: open-craft-table, label: Open the craft studies table, action: "route:craft/craft-table"}
    config_form: true
  fleet:
    capabilities:
      - name: halo-re.analysis
        description: Runs a binary analysis on a harness that runs the pack
        requires:
          runtimes: [python]
        capacity:
          parallel: 1
    inspector:
      - label: "Halo RE: what a part needs"
        source: fleet/notes.md
    mission:
      metadata:
        pack: halo-re
  # schemas/, playbooks/ and resources/ are the pack's data files, read by its
  # own tools and referenced from the bios — not registry contributions.
permissions:
  - mcp:ghidra
  - bash        # the skills drive CLI RE tools (file/nm/strings/otool, ghidrecomp, opengrep, craft-anything-cli)
  - studio-script # the findings browser bundle panel (studio/findings.js)
config:
  schema:
    type: object
    properties:
      ghidra_install_dir:
        {type: string, description: "Path to a Ghidra install (the folder holding Ghidra/application.properties). Auto-detected when empty; the doctor skill verifies by effect and can download the official release on demand."}
      project_dir:
        {type: string, description: "Where Ghidra projects live. MUST NOT contain a path element starting with a dot (Ghidra refuses it). Default ~/ghidra-projects."}
      tools_dir:
        {type: string, description: "Where the on-demand installer puts downloads (default ~/halo-re-tools). The Ghidra/REA release zips land under <tools_dir>/downloads/."}
      rea_dir:
        {type: string, description: "Where the optional REA (Reverse Engineer Anything) release was extracted, if you installed it."}
      craft_anything_cli_path:
        {type: string, description: "Path to the craft-anything-cli binary (external tool, not bundled). Empty = auto-detect on PATH; when absent the craft-anything skill skips visibly."}
    additionalProperties: false
  defaults:
    ghidra_install_dir: ""
    project_dir: ""
    tools_dir: ""
    rea_dir: ""
    craft_anything_cli_path: ""
migrations: []
